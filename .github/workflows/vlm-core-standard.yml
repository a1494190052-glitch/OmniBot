name: VLM Core Standard

on:
  push:
    branches:
      - vlm-core
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vlm-core-standard
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.38.7'
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
  ANDROID_PLATFORM_VERSION: '36'
  ANDROID_CMAKE_VERSION: '3.22.1'
  NDK_VERSION: '28.2.13676358'
  ALLOWED_THIRD_PARTY_WRAPPER_SHA: 'ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout vlm-core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify embedded runtime snapshot
        shell: bash
        run: python3 scripts/sync-embedded-omniflow-runtime.py --check-embedded

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: ${{ env.ALLOWED_THIRD_PARTY_WRAPPER_SHA }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-${{ env.ANDROID_PLATFORM_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/licenses
          key: ${{ runner.os }}-android-vlm-core-${{ env.NDK_VERSION }}-${{ env.ANDROID_PLATFORM_VERSION }}-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-${{ env.ANDROID_CMAKE_VERSION }}

      - name: Ensure Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          license_status=$?
          set -o pipefail
          if [[ "${license_status}" -ne 0 ]]; then
            exit "${license_status}"
          fi
          sdkmanager \
            "ndk;${NDK_VERSION}" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_KEYSTORE_B64}"
          printf '%s' "${RELEASE_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          chmod 600 "${RUNNER_TEMP}/release.jks"

      - name: Build and optionally publish Standard APK
        id: release
        shell: bash
        env:
          VLM_CORE_PUBLISH: ${{ vars.VLM_CORE_AUTO_PUBLISH_ENABLED }}
          VLM_CORE_ARTIFACT_DIR: ${{ runner.temp }}/vlm-core-standard
          APP_UPDATE_WORKER_URL: ${{ secrets.APP_UPDATE_WORKER_URL }}
          APP_UPDATE_WORKER_TOKEN: ${{ secrets.APP_UPDATE_WORKER_TOKEN }}
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
          OMNI_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          OMNI_RELEASE_STORE_PWD: ${{ secrets.RELEASE_PASSWORD }}
          OMNI_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          OMNI_RELEASE_KEY_PWD: ${{ secrets.RELEASE_PASSWORD }}
        run: bash scripts/build-vlm-core-standard-ci.sh

      - name: Upload Standard APK artifact
        if: always() && steps.release.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: OpenOmniBot-${{ steps.release.outputs.release_tag }}-vlm-core-standard
          if-no-files-found: error
          path: |
            ${{ steps.release.outputs.artifact_dir }}/*.apk
            ${{ steps.release.outputs.artifact_dir }}/*.sha256
            ${{ steps.release.outputs.artifact_dir }}/manifest.txt

      - name: Write release summary
        if: always() && steps.release.outputs.version_name != ''
        shell: bash
        run: |
          {
            echo "## VLM Core Standard"
            echo "- Version: ${{ steps.release.outputs.version_name }}"
            echo "- Channel: vlm-core"
            echo "- Published to Worker: ${{ steps.release.outputs.published }}"
            echo "- Client behavior: prompt only; installation requires user confirmation"
          } >> "$GITHUB_STEP_SUMMARY"
