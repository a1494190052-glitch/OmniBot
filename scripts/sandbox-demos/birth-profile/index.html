<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>出生信息</title><style>
:root{color-scheme:dark;--night:#101329;--card:#1a2042;--gold:#f2c56e;--blue:#c9d4ff;--muted:#9da7ca}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 8%,#344481 0,#151a38 26%,#090b19 70%);color:#f8f3e7;font:16px/1.5 system-ui,sans-serif;min-height:100vh}.app{max-width:560px;margin:auto;padding:calc(30px + env(safe-area-inset-top)) 20px calc(34px + env(safe-area-inset-bottom))}.moon{font-size:46px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.18em}h1{font-size:40px;line-height:1.05;margin:10px 0}.lead{color:var(--muted)}.card{background:#1a2042dd;border:1px solid #384373;border-radius:28px;padding:22px;margin-top:20px;box-shadow:0 20px 60px #0006}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;color:var(--blue);margin:10px 0 6px}input{width:100%;border:1px solid #414c7a;background:var(--night);color:white;border-radius:14px;padding:14px;font:inherit}.wide{grid-column:1/-1}button{width:100%;border:0;border-radius:17px;background:var(--gold);color:#24203a;padding:16px;font-size:16px;font-weight:850;margin-top:16px}.secondary{background:#313a68;color:white}.status{min-height:25px;color:var(--muted);margin-top:10px}.result{white-space:pre-wrap;color:#f9ebca;border-left:3px solid var(--gold);padding-left:16px;margin-top:18px}.profile{padding:12px 0;border-bottom:1px solid #333c68}.profile:last-child{border:0}.profile small{display:block;color:var(--muted)}
</style></head><body><main class="app"><div class="moon">☾</div><div class="eyebrow">PRIVATE PROFILE</div><h1>记住出生时刻</h1><p class="lead">资料只写入这个插件的独立数据库；文化解读由 LLM API 生成，仅供娱乐。</p><section class="card"><form id="form"><div class="grid"><div class="wide"><label for="name">姓名</label><input id="name" required></div><div><label for="date">日期</label><input id="date" type="date" required></div><div><label for="time">时间</label><input id="time" type="time" required></div><div class="wide"><label for="place">地点</label><input id="place" placeholder="例如：杭州" required></div></div><button id="save" type="submit">保存资料</button><button id="interpret" class="secondary" type="button">生成文化解读</button><div id="status" class="status" role="status"></div><div id="result" class="result"></div></form></section><section class="card"><div class="eyebrow">SAVED LOCALLY</div><h2>已保存资料</h2><div id="profiles">正在读取…</div></section></main><script>
const get=id=>document.getElementById(id);const clean=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const values=()=>({person_name:get('name').value.trim(),birth_date:get('date').value,birth_time:get('time').value,birth_place:get('place').value.trim()});
async function load(){const response=await window.omni.tools.call('list_profiles',{_limit:12});const rows=response.rows||[];get('profiles').innerHTML=rows.length?rows.map(row=>`<div class="profile"><b>${clean(row.person_name)}</b><small>${clean(row.birth_date)} ${clean(row.birth_time)} · ${clean(row.birth_place)}</small></div>`).join(''):'<p class="lead">还没有资料。</p>'}
get('form').addEventListener('submit',async event=>{event.preventDefault();const button=get('save');button.disabled=true;get('status').textContent='正在通过共享工具写入档案…';try{await window.omni.tools.call('save_profile',values());get('status').textContent='已保存。';await load()}catch(error){get('status').textContent=`保存失败：${error.message||error}`}finally{button.disabled=false}});
get('interpret').addEventListener('click',async()=>{const profile=values();if(Object.values(profile).some(value=>!value)){get('status').textContent='请先完整填写出生信息。';return}const button=get('interpret');button.disabled=true;get('status').textContent='小万正在生成文化娱乐解读…';get('result').textContent='';try{const response=await window.omni.tools.call('interpret_profile',profile);get('result').textContent=response.text;get('status').textContent=`已由 ${response.model||'LLM API'} 生成`}catch(error){get('status').textContent=`解读失败：${error.message||error}`}finally{button.disabled=false}});load().catch(error=>get('profiles').textContent=`载入失败：${error.message||error}`);
</script></body></html>
