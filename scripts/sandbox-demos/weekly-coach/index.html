<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>每周教练</title><style>
:root{color-scheme:light;--purple:#352a66;--lime:#b9ff66;--pink:#ff7ca8;--paper:#f7f3ff;--muted:#736e89}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#d8ccff,#fff 48%,#e9ffc9);color:var(--purple);font:16px/1.55 system-ui,sans-serif;min-height:100vh}.app{max-width:560px;margin:auto;padding:calc(30px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom))}.tag{display:inline-block;background:var(--lime);border-radius:99px;padding:7px 12px;font-size:12px;font-weight:800;letter-spacing:.08em}h1{font-size:44px;line-height:1.02;margin:18px 0 10px}.lead{color:var(--muted);font-size:17px}.card{background:#ffffffdb;border:1px solid #fff;border-radius:30px;padding:22px;margin-top:24px;box-shadow:0 22px 60px #51418324}label{display:block;font-size:13px;font-weight:750;margin:14px 0 6px}input,textarea{width:100%;border:1px solid #d7d0ee;border-radius:15px;padding:14px;background:var(--paper);font:inherit;color:var(--purple)}textarea{min-height:86px;resize:vertical}button{width:100%;border:0;border-radius:18px;background:var(--purple);color:white;padding:17px;font-size:17px;font-weight:800;margin-top:18px}button:disabled{opacity:.55}.status{display:flex;gap:10px;align-items:center;min-height:30px;color:var(--muted);margin-top:12px}.dot{width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 6px #ff7ca822}.output{white-space:pre-wrap;background:var(--paper);border-radius:22px;padding:20px;min-height:120px;margin-top:12px}.hidden{display:none}
</style></head><body><main class="app"><span class="tag">7 DAY RESET</span><h1>把目标变成<br>这一周。</h1><p class="lead">告诉小万你想完成什么，以及现实中的限制。生成过程走 LLM API，不暴露密钥。</p><section class="card"><form id="form"><label for="goal">这一周的目标</label><input id="goal" placeholder="例如：恢复规律运动" required><label for="minutes">每天可投入分钟</label><input id="minutes" type="number" min="5" max="240" value="20" required><label for="constraints">限制条件</label><textarea id="constraints" placeholder="例如：工作日只能晚上，膝盖不适合跳跃"></textarea><button id="generate" type="submit">生成我的七天计划</button><div id="status" class="status" role="status"></div></form><div id="result-wrap" class="hidden"><h2>你的计划</h2><div id="output" class="output"></div></div></section></main><script>
const byId=id=>document.getElementById(id);byId('form').addEventListener('submit',async event=>{event.preventDefault();const button=byId('generate');button.disabled=true;byId('status').innerHTML='<span class="dot"></span><span>小万正在整理目标与限制…</span>';try{const result=await window.omni.ai.generate({system:'你是简洁、务实的中文行动教练。不要虚构用户未提供的事实。',prompt:`目标：${byId('goal').value.trim()}\n每天可投入：${byId('minutes').value}分钟\n限制：${byId('constraints').value.trim()||'无'}\n请生成七天计划，每天一个短行动，最后给一个可衡量的成功标准。`,maxTokens:900,temperature:.2});byId('output').textContent=result.text;byId('result-wrap').classList.remove('hidden');byId('status').textContent=`已由 ${result.model||'LLM API'} 生成`}catch(error){byId('status').textContent=`生成失败：${error.message||error}。可以重试，输入不会丢失。`}finally{button.disabled=false}});
</script></body></html>
