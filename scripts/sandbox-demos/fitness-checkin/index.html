<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>健身打卡</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1913;--card:#153426;--lime:#e9ff70;--ink:#f7f2e8;--muted:#a6b8ad}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#173e2c 0,#09110d 55%);color:var(--ink);font:16px/1.5 system-ui,sans-serif;min-height:100vh}.app{max-width:560px;margin:auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}h1{font-size:38px;line-height:1;margin:8px 0}.eyebrow{color:var(--lime);font-weight:800;letter-spacing:.18em;font-size:12px}.count{font-size:42px;font-weight:800;color:var(--lime)}.card{background:rgba(21,52,38,.9);border:1px solid #315541;border-radius:28px;padding:20px;margin:14px 0;box-shadow:0 18px 45px #0005}.grid{display:grid;grid-template-columns:1.4fr .7fr .7fr;gap:10px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input{width:100%;border:1px solid #41634f;border-radius:14px;background:#0d2118;color:var(--ink);padding:14px;font:inherit}button{width:100%;border:0;border-radius:18px;background:var(--lime);color:#10271c;padding:17px;font-size:17px;font-weight:850;margin-top:16px}.status{min-height:24px;color:var(--muted);margin-top:10px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #2b4938}.row:last-child{border:0}.row b{display:block}.row small{color:var(--muted)}.weight{font-size:24px;font-weight:800;color:var(--lime)}.empty{color:var(--muted);padding:24px 0;text-align:center}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.grid>div:first-child{grid-column:1/-1}}
  </style>
</head>
<body><main class="app"><header><div><div class="eyebrow">WORKOUT MEMORY</div><h1>今天练了吗？</h1><div style="color:var(--muted)">每一次完成，都写进你的本地训练档案。</div></div><div><span id="count" class="count">0</span><small> 次</small></div></header><section class="card"><form id="form"><div class="grid"><div><label for="exercise">动作</label><input id="exercise" placeholder="例如：深蹲" required></div><div><label for="weight">重量 kg</label><input id="weight" type="number" min="0" step="0.5" value="20" required></div><div><label for="reps">次数</label><input id="reps" type="number" min="1" value="8" required></div></div><button id="save" type="submit">完成这组训练</button><div id="status" class="status" role="status"></div></form></section><section class="card"><div class="eyebrow">RECENT LOG</div><h2>最近训练</h2><div id="list" class="empty">正在读取本地记录…</div></section></main><script>
const element=id=>document.getElementById(id);const escapeText=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function load(){const result=await window.omni.tools.call('list_workouts',{_order_by:'id DESC',_limit:500});const rows=result.rows||[];element('count').textContent=rows.length;element('list').className='';element('list').innerHTML=rows.length?rows.slice(0,20).map(row=>`<div class="row"><div><b>${escapeText(row.exercise)}</b><small>${escapeText(row.recorded_at)} · ${row.repetitions} 次</small></div><div class="weight">${Number(row.weight)}kg</div></div>`).join(''):'<div class="empty">还没有记录，完成第一组吧。</div>'}
element('form').addEventListener('submit',async event=>{event.preventDefault();const button=element('save');button.disabled=true;element('status').textContent='正在通过共享工具写入训练档案…';try{await window.omni.tools.call('record_workout',{exercise:element('exercise').value.trim(),weight:Number(element('weight').value),repetitions:Number(element('reps').value),recorded_at:new Date().toLocaleString('zh-CN')});element('status').textContent='已保存。';await load()}catch(error){element('status').textContent=`保存失败：${error.message||error}`}finally{button.disabled=false}});load().catch(error=>element('list').textContent=`载入失败：${error.message||error}`);
  </script></body>
</html>
